[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wonderland-sdk"
version = "0.1.0"
description = "Client Python pour connecter un bot au serveur Wonderland"
requires-python = ">=3.10"
dependencies = ["websockets>=12"]

[tool.setuptools.packages.find]
include = ["wonderland_sdk*"]
